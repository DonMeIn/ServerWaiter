[project]
name = "waiter-demonpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DonMeIn", email = "d.m.i.address.mail@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.2.0",
    "fastapi>=0.162.0",
    "fastapi-mail>=1.6.8",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
waiter-demonpy = "waiter_demonpy:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
